name: Deploy to Baota Server

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      purge_proxy_cache:
        description: Clear Baota Nginx reverse-proxy cache during this deployment
        required: false
        type: boolean
        default: false

concurrency:
  group: hkba-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Sync and restart HKBA
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SSH_HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      SSH_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
      FRONTEND_PORT: ${{ secrets.FRONTEND_PORT }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SEED_ON_FIRST_DEPLOY: ${{ secrets.SEED_ON_FIRST_DEPLOY }}
      PURGE_PROXY_CACHE: ${{ inputs.purge_proxy_cache || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          bundle_file="$RUNNER_TEMP/hkba_deploy_bundle"
          trap 'rm -f "$bundle_file"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$bundle_file"
          bash .github/scripts/resolve-deploy-bundle.sh \
            "$bundle_file" \
            "$GITHUB_ENV" \
            "$RUNNER_TEMP/hkba_deploy_key"

      - name: Validate required deployment variables
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in SSH_HOST SSH_USER DEPLOY_PATH BACKEND_PORT FRONTEND_PORT ALLOWED_ORIGINS JWT_SECRET; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required deployment variables: %s\n' "${missing[*]}"
            exit 1
          fi
          if [[ ! "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]; then
            printf 'DEPLOY_USER contains unsupported characters.\n' >&2
            exit 1
          fi
          if [[ ! "$SSH_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]; then
            printf 'DEPLOY_HOST contains unsupported characters.\n' >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            printf 'DEPLOY_PATH must be an absolute path without whitespace.\n' >&2
            exit 1
          fi
          for name in SSH_PORT BACKEND_PORT FRONTEND_PORT; do
            value=${!name}
            if [[ ! "$value" =~ ^[0-9]+$ ]] || [ "$value" -lt 1 ] || [ "$value" -gt 65535 ]; then
              printf '%s must be a port between 1 and 65535.\n' "$name" >&2
              exit 1
            fi
          done
          if [ -n "$ADMIN_INITIAL_PASSWORD" ] && [ "${#ADMIN_INITIAL_PASSWORD}" -lt 12 ]; then
            printf 'ADMIN_INITIAL_PASSWORD must contain at least 12 characters.\n' >&2
            exit 1
          fi
          if [ "${#JWT_SECRET}" -lt 32 ]; then
            printf 'JWT_SECRET must contain at least 32 characters.\n' >&2
            exit 1
          fi
          for name in SEED_ON_FIRST_DEPLOY PURGE_PROXY_CACHE; do
            value=${!name}
            if [ "$value" != "true" ] && [ "$value" != "false" ]; then
              printf '%s must be true or false.\n' "$name" >&2
              exit 1
            fi
          done
          for name in JWT_SECRET ADMIN_INITIAL_PASSWORD ALLOWED_ORIGINS; do
            value=${!name}
            if [[ "$value" == *$'\n'* ]] || [[ "$value" == *"'"* ]]; then
              printf '%s cannot contain a newline or single quote.\n' "$name" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          test -s "$RUNNER_TEMP/hkba_deploy_key"
          chmod 600 "$RUNNER_TEMP/hkba_deploy_key"
          ssh-keygen -y -f "$RUNNER_TEMP/hkba_deploy_key" >/dev/null
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Prepare server directory
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/hkba_deploy_key" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_PATH/backend/db/backups' '$DEPLOY_PATH/backend/uploads'"

      - name: Sync project files
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete --no-owner --no-group \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='frontend/node_modules/' \
            --exclude='frontend/.next/' \
            --exclude='backend/node_modules/' \
            --exclude='backend/.env' \
            --exclude='backend/db/*.db' \
            --exclude='backend/db/*.db-*' \
            --exclude='backend/db/backups/' \
            --exclude='backend/uploads/' \
            -e "ssh -i $RUNNER_TEMP/hkba_deploy_key -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Upload production backend environment
        shell: bash
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/hkba_backend_env"
          umask 077
          {
            printf 'PORT=%s\n' "$BACKEND_PORT"
            printf 'NODE_ENV=production\n'
            printf "JWT_SECRET='%s'\n" "$JWT_SECRET"
            if [ -n "$ADMIN_INITIAL_PASSWORD" ]; then
              printf "ADMIN_INITIAL_PASSWORD='%s'\n" "$ADMIN_INITIAL_PASSWORD"
            fi
            printf "ALLOWED_ORIGINS='%s'\n" "$ALLOWED_ORIGINS"
          } > "$env_file"
          scp -q -i "$RUNNER_TEMP/hkba_deploy_key" -P "$SSH_PORT" \
            "$env_file" "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/backend/.env.next"
          ssh -i "$RUNNER_TEMP/hkba_deploy_key" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "chmod 600 '$DEPLOY_PATH/backend/.env.next' && mv '$DEPLOY_PATH/backend/.env.next' '$DEPLOY_PATH/backend/.env'"

      - name: Install, build, and restart services
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/hkba_deploy_key" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' \
             BACKEND_PORT='$BACKEND_PORT' \
             FRONTEND_PORT='$FRONTEND_PORT' \
             SEED_ON_FIRST_DEPLOY='$SEED_ON_FIRST_DEPLOY' \
             PURGE_PROXY_CACHE='$PURGE_PROXY_CACHE' \
             bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_PATH"
          mkdir -p backend/db/backups backend/uploads

          cd "$DEPLOY_PATH/backend"
          if [ -f package-lock.json ]; then
            npm ci --omit=dev
          else
            npm install --omit=dev
          fi

          if [ -f db/hkba.db ]; then
            node scripts/backup-db.js
          else
            printf 'No existing database found; pre-deploy backup skipped.\n'
          fi

          if [ "$SEED_ON_FIRST_DEPLOY" = "true" ]; then
            DOTENV_CONFIG_PATH=.env node -r dotenv/config db/seed-if-empty.js
          fi

          DOTENV_CONFIG_PATH=.env node -r dotenv/config scripts/migrate-content.js --no-backup

          if pm2 describe hkba-api >/dev/null 2>&1; then
            pm2 reload hkba-api --update-env
          else
            pm2 start server.js --name hkba-api
          fi

          cd "$DEPLOY_PATH/frontend"
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          rm -rf .next
          HKBA_API_INTERNAL="http://127.0.0.1:$BACKEND_PORT" npm run build

          pm2 delete hkba-web >/dev/null 2>&1 || true
          PORT="$FRONTEND_PORT" \
          HKBA_API_INTERNAL="http://127.0.0.1:$BACKEND_PORT" \
          pm2 start npm \
            --name hkba-web \
            --cwd "$DEPLOY_PATH/frontend" \
            -- start

          if [ "$PURGE_PROXY_CACHE" = "true" ]; then
            proxy_cache_dir=/www/server/nginx/proxy_cache_dir
            if [ -d "$proxy_cache_dir" ]; then
              find "$proxy_cache_dir" -mindepth 1 -delete
              printf 'Cleared Baota Nginx reverse-proxy cache.\n'
            fi
          fi

          if ! id www >/dev/null 2>&1; then
            printf 'Required Baota user "www" does not exist.\n' >&2
            exit 1
          fi
          chown -R www:www "$DEPLOY_PATH"

          pm2 status
          node "$DEPLOY_PATH/scripts/deploy-smoke.js" \
            --frontend-url "http://127.0.0.1:$FRONTEND_PORT" \
            --backend-url "http://127.0.0.1:$BACKEND_PORT" \
            --attempts 10 \
            --delay-ms 2000
          pm2 save
          REMOTE
