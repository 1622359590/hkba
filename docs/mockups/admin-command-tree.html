<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HKBA 管理總樹 - 儀表盤原型</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef1f4;
      --surface: #ffffff;
      --surface-soft: #f8f9fa;
      --surface-strong: #1c2532;
      --line: #dbe1e7;
      --line-strong: #c8d0d9;
      --ink: #17202d;
      --ink-2: #536171;
      --ink-3: #7b8897;
      --gold: #9a721c;
      --gold-soft: #f7f0df;
      --gold-line: #e4d2a5;
      --cyan: #0b7f8c;
      --cyan-soft: #e7f5f6;
      --danger: #b42335;
      --danger-soft: #fff0f1;
      --success: #087a5b;
      --success-soft: #eaf7f1;
      --warning: #955c08;
      --warning-soft: #fff6dd;
      --sidebar: 214px;
      --topbar: 72px;
      --radius: 14px;
      --ease: cubic-bezier(.16, 1, .3, 1);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang TC", "PingFang SC", "Microsoft JhengHei", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-width: 1100px;
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
    }

    button, input { font: inherit; }

    button { color: inherit; }

    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    .app { display: flex; min-height: 100vh; }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--sidebar);
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-right: 1px solid var(--line);
    }

    .brand {
      height: var(--topbar);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: #d5ae4b;
      color: #1f1808;
      font-weight: 850;
      box-shadow: 0 5px 8px rgba(109, 77, 13, .16);
    }

    .brand-copy { display: grid; gap: 2px; }
    .brand-copy strong { font-size: 13px; letter-spacing: -.01em; }
    .brand-copy span { color: var(--gold); font-size: 11px; font-weight: 700; }

    .nav {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 16px 12px;
    }

    .nav a {
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border: 1px solid transparent;
      border-radius: 11px;
      color: var(--ink-2);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }

    .nav a:hover { background: var(--surface-soft); color: var(--ink); }

    .nav a.active {
      background: var(--gold-soft);
      border-color: var(--gold-line);
      color: var(--ink);
    }

    .nav-glyph {
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #eef1f4;
      color: #526171;
      font-size: 11px;
      font-weight: 800;
    }

    .nav a.active .nav-glyph { background: #fff; color: var(--gold); }

    .sidebar-foot {
      padding: 13px 12px;
      border-top: 1px solid var(--line);
    }

    .sidebar-foot button {
      width: 100%;
      min-height: 40px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--ink-2);
      text-align: left;
      cursor: pointer;
    }

    .shell { width: calc(100% - var(--sidebar)); margin-left: var(--sidebar); }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      height: var(--topbar);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 26px;
      background: rgba(255, 255, 255, .96);
      border-bottom: 1px solid var(--line);
    }

    .page-title { display: grid; gap: 3px; }
    .page-title span { color: var(--gold); font-size: 10px; font-weight: 800; letter-spacing: .12em; }
    .page-title h1 { margin: 0; font-size: 20px; letter-spacing: -.025em; }

    .top-actions { display: flex; align-items: center; gap: 9px; }

    .button {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 13px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      background: var(--surface);
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms var(--ease), background 160ms var(--ease), border-color 160ms var(--ease);
    }

    .button:hover { background: var(--surface-soft); border-color: #aeb8c2; }
    .button:active { transform: scale(.98); }
    .button.primary { background: var(--ink); border-color: var(--ink); color: #f7f9fb; }
    .button.primary:hover { background: #263243; }

    .content { padding: 20px 24px 26px; }

    .command-strip {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      margin-bottom: 12px;
    }

    .search {
      width: min(510px, 44vw);
      min-height: 40px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
    }

    .search::before {
      content: "⌕";
      color: var(--ink-3);
      font-size: 19px;
      line-height: 1;
    }

    .search input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 13px;
    }

    .search input::placeholder { color: #667586; opacity: 1; }

    .attention {
      display: flex;
      align-items: center;
      gap: 18px;
      color: var(--ink-2);
      font-size: 12px;
    }

    .attention strong { color: var(--ink); font-variant-numeric: tabular-nums; }
    .attention .urgent strong { color: var(--danger); }

    .workspace {
      height: calc(100vh - var(--topbar) - 82px);
      min-height: 650px;
      display: grid;
      grid-template-columns: minmax(355px, .72fr) minmax(620px, 1.28fr);
      overflow: hidden;
      background: var(--surface);
      border: 0;
      border-radius: var(--radius);
      box-shadow: 0 8px 14px rgba(21, 32, 45, .08);
    }

    .tree-panel {
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: #111823;
      border-right: 1px solid #273141;
    }

    .panel-head {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 14px 18px;
      border-bottom: 1px solid #2a3544;
    }

    .panel-head-copy { display: grid; gap: 4px; }
    .panel-head h2 { margin: 0; color: #f2f5f8; font-size: 15px; letter-spacing: -.015em; }
    .panel-head p { margin: 0; color: #8e9bac; font-size: 11px; }

    .segmented {
      display: flex;
      padding: 3px;
      border: 1px solid #303b4a;
      border-radius: 9px;
      background: #0b111a;
    }

    .segmented button {
      min-height: 28px;
      padding: 0 9px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #8e9bac;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .segmented button.active { background: #283343; color: #f6f8fa; box-shadow: none; }

    .tree-scroll { flex: 1; overflow: auto; padding: 16px 14px 26px; }

    .tree, .tree ul { margin: 0; padding: 0; list-style: none; }

    .tree ul {
      position: relative;
      margin-left: 18px;
      padding-left: 22px;
    }

    .tree ul::before {
      content: "";
      position: absolute;
      inset: 0 auto 12px 7px;
      width: 1px;
      background: #354052;
    }

    .tree li { position: relative; }

    .tree li li::before {
      content: "";
      position: absolute;
      top: 21px;
      left: -15px;
      width: 15px;
      height: 1px;
      background: #354052;
    }

    .tree-row {
      width: 100%;
      min-height: 43px;
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      margin: 3px 0;
      padding: 5px 9px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: #aeb8c6;
      text-align: left;
      cursor: pointer;
      transition: background 170ms var(--ease), border-color 170ms var(--ease), color 170ms var(--ease), transform 170ms var(--ease);
    }

    .tree-row:hover { background: #1c2634; color: #f4f7fa; }
    .tree-row:active { transform: translateY(1px); }

    .tree-row.selected {
      background: #d6b24f;
      border-color: #d6b24f;
      color: #171b20;
    }

    .tree-row.root {
      min-height: 56px;
      margin-bottom: 12px;
      background: #202b3a;
      border-color: #344154;
      color: #f0f3f6;
    }

    .tree-row.root:hover { background: #283649; }

    .node-mark {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: #263241;
      color: #bac5d1;
      font-size: 9px;
      font-weight: 850;
    }

    .root .node-mark { background: #d5ae4b; color: #211908; }
    .selected .node-mark { background: #171d26; color: #e1c26c; }

    .node-copy { min-width: 0; display: grid; gap: 2px; }
    .node-copy strong { overflow: hidden; font-size: 12px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .node-copy small { overflow: hidden; color: #7f8d9f; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .selected .node-copy small { color: #5c4b1f; }
    .root .node-copy small { color: #aab5c3; }

    .node-meta { display: flex; align-items: center; gap: 6px; }

    .count {
      min-width: 24px;
      padding: 3px 7px;
      border-radius: 999px;
      background: #273241;
      color: #aab5c2;
      font-size: 10px;
      font-weight: 800;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .count.warn { background: #3d3219; color: #f1cf70; }
    .count.danger { background: #43242a; color: #ffb1ba; }
    .selected .count { background: rgba(23, 27, 32, .13); color: #4e3c0f; }

    .chevron {
      width: 7px;
      height: 7px;
      margin-right: 4px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg) translateY(-2px);
      transition: transform 170ms var(--ease);
    }

    li.collapsed > .tree-row .chevron { transform: rotate(-45deg); }
    li.collapsed > ul { display: none; }

    .tree.only-issues li:not([data-issue="true"]):not(:has(li[data-issue="true"])) { display: none; }
    .tree-row.filtered-out { opacity: .22; }

    .detail-panel { min-width: 0; display: flex; flex-direction: column; background: var(--surface); }

    .detail-head {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 13px 20px;
      border-bottom: 1px solid var(--line);
    }

    .detail-title { min-width: 0; display: grid; gap: 3px; }
    .detail-title p { margin: 0; color: var(--ink-3); font-size: 10px; font-weight: 700; }
    .detail-title h2 { margin: 0; overflow: hidden; font-size: 17px; letter-spacing: -.025em; text-overflow: ellipsis; white-space: nowrap; }
    .detail-actions { display: flex; gap: 8px; }
    .detail-body { flex: 1; overflow: auto; padding: 20px; }

    .summary {
      display: grid;
      grid-template-columns: 1.35fr repeat(3, minmax(90px, .65fr));
      margin-bottom: 20px;
      border: 1px solid #d7dde4;
      border-radius: 12px;
      overflow: hidden;
    }

    .summary-main, .metric { min-height: 86px; padding: 14px; }
    .summary-main { background: #f0f3f6; }
    .summary-main strong { display: block; margin-bottom: 5px; font-size: 14px; }
    .summary-main p { max-width: 34ch; margin: 0; color: var(--ink-2); font-size: 11px; line-height: 1.6; }
    .metric { border-left: 1px solid var(--line); }
    .metric span { display: block; margin-bottom: 8px; color: var(--ink-3); font-size: 10px; }
    .metric strong { font-size: 22px; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
    .metric small { display: block; margin-top: 4px; color: var(--ink-2); font-size: 9px; }
    .metric.warning strong { color: var(--warning); }
    .metric.danger strong { color: var(--danger); }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 0 0 9px;
    }

    .section-title h3 { margin: 0; font-size: 13px; }
    .section-title span { color: var(--ink-3); font-size: 10px; }

    .record-list { border-top: 1px solid var(--line); }

    .record {
      min-height: 57px;
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(92px, .6fr) 88px auto;
      align-items: center;
      gap: 12px;
      padding: 9px 4px;
      border-bottom: 1px solid var(--line);
    }

    .record:hover { background: #fafbfc; }

    .record-name { min-width: 0; display: grid; gap: 3px; }
    .record-name strong { overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .record-name small, .record-info { color: var(--ink-3); font-size: 10px; }

    .status {
      width: fit-content;
      display: inline-flex;
      align-items: center;
      min-height: 23px;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--success-soft);
      color: var(--success);
      font-size: 9px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status.draft { background: var(--warning-soft); color: var(--warning); }
    .status.missing { background: var(--danger-soft); color: var(--danger); }

    .text-action {
      border: 0;
      background: transparent;
      color: var(--cyan);
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .text-action:hover { text-decoration: underline; text-underline-offset: 3px; }

    .org-groups { display: grid; gap: 10px; }

    .org-group {
      display: grid;
      grid-template-columns: 148px minmax(0, 1fr);
      align-items: start;
      gap: 16px;
      padding: 13px 0;
      border-top: 1px solid var(--line);
    }

    .org-group h4 { margin: 3px 0 5px; font-size: 12px; }
    .org-group > div:first-child span { color: var(--ink-3); font-size: 10px; }

    .people { display: flex; flex-wrap: wrap; gap: 8px; }

    .person {
      min-width: 150px;
      flex: 1 1 180px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px;
      border-radius: 9px;
      background: #f5f7f9;
      cursor: pointer;
    }

    .person:hover { background: #edf2f5; }

    .avatar {
      width: 31px;
      height: 31px;
      flex: 0 0 31px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #dbe3e8;
      color: #435365;
      font-size: 10px;
      font-weight: 850;
    }

    .person-copy { min-width: 0; display: grid; gap: 2px; }
    .person-copy strong { font-size: 11px; }
    .person-copy small { overflow: hidden; color: var(--ink-3); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }

    .empty-note {
      display: grid;
      place-items: center;
      min-height: 240px;
      padding: 40px;
      color: var(--ink-2);
      text-align: center;
    }

    .empty-note strong { display: block; margin-bottom: 7px; color: var(--ink); font-size: 15px; }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 20;
      min-width: 240px;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--surface-strong);
      color: #edf2f6;
      font-size: 12px;
      box-shadow: 0 8px 14px rgba(16, 24, 40, .18);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 180ms var(--ease), transform 180ms var(--ease);
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 1280px) {
      :root { --sidebar: 204px; }
      .workspace { grid-template-columns: minmax(390px, .82fr) minmax(530px, 1.18fr); }
      .summary { grid-template-columns: 1.2fr repeat(3, minmax(78px, .6fr)); }
      .attention { gap: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="後台主導航">
      <div class="brand">
        <div class="brand-mark">H</div>
        <div class="brand-copy"><strong>HKBA CMS</strong><span>Content Ops</span></div>
      </div>
      <nav class="nav">
        <a class="active" href="#"><span class="nav-glyph">總</span>管理總樹</a>
        <a href="#"><span class="nav-glyph">B</span>Banner</a>
        <a href="#"><span class="nav-glyph">新</span>新聞</a>
        <a href="#"><span class="nav-glyph">活</span>活動</a>
        <a href="#"><span class="nav-glyph">頁</span>頁面</a>
        <a href="#"><span class="nav-glyph">媒</span>媒體庫</a>
        <a href="#"><span class="nav-glyph">留</span>留言</a>
        <a href="#"><span class="nav-glyph">團</span>團隊</a>
        <a href="#"><span class="nav-glyph">員</span>會員</a>
        <a href="#"><span class="nav-glyph">設</span>設置</a>
      </nav>
      <div class="sidebar-foot"><button type="button">退出登入</button></div>
    </aside>

    <div class="shell">
      <header class="topbar">
        <div class="page-title"><span>HKBA ADMIN</span><h1>管理總樹</h1></div>
        <div class="top-actions">
          <button class="button" type="button" data-toast="已打開網站前台預覽">查看前台</button>
          <button class="button primary" type="button" data-toast="已打開新增內容選單">新增內容</button>
        </div>
      </header>

      <main class="content">
        <div class="command-strip">
          <label class="search">
            <input id="globalSearch" type="search" placeholder="搜尋頁面、成員、新聞或模組..." autocomplete="off">
          </label>
          <div class="attention" aria-label="待處理摘要">
            <span class="urgent"><strong>5</strong> 項待處理</span>
            <span><strong>2</strong> 篇草稿</span>
            <span><strong>1</strong> 則未讀留言</span>
          </div>
        </div>

        <section class="workspace" aria-label="HKBA 管理總樹工作台">
          <div class="tree-panel">
            <div class="panel-head">
              <div class="panel-head-copy">
                <h2>HKBA 全站結構</h2>
                <p>點擊節點查看所屬內容和直接操作</p>
              </div>
              <div class="segmented" aria-label="樹狀圖篩選">
                <button class="active" type="button" id="showAll">全部</button>
                <button type="button" id="showIssues">待處理</button>
              </div>
            </div>

            <div class="tree-scroll">
              <ul class="tree" id="commandTree">
                <li data-issue="true">
                  <button class="tree-row root selected" type="button" data-view="overview" data-label="HKBA 香港區塊鏈協會">
                    <span class="node-mark">H</span>
                    <span class="node-copy"><strong>HKBA 香港區塊鏈協會</strong><small>全站內容與組織中樞</small></span>
                    <span class="node-meta"><span class="count danger">5</span><span class="chevron"></span></span>
                  </button>
                  <ul>
                    <li class="collapsed" data-issue="true">
                      <button class="tree-row" type="button" data-view="website" data-label="網站 頁面 結構">
                        <span class="node-mark">網</span>
                        <span class="node-copy"><strong>網站</strong><small>頁面、導覽與雙語狀態</small></span>
                        <span class="node-meta"><span class="count warn">2</span><span class="chevron"></span></span>
                      </button>
                      <ul>
                        <li><button class="tree-row" type="button" data-view="home" data-label="首頁 Home"><span class="node-mark">頁</span><span class="node-copy"><strong>首頁</strong><small>/</small></span><span class="node-meta"><span class="count">8 區塊</span></span></button></li>
                        <li data-issue="true"><button class="tree-row" type="button" data-view="page" data-label="關於協會 About"><span class="node-mark">頁</span><span class="node-copy"><strong>關於協會</strong><small>/about</small></span><span class="node-meta"><span class="count warn">草稿</span></span></button></li>
                        <li><button class="tree-row" type="button" data-view="content" data-label="新聞動態 News"><span class="node-mark">頁</span><span class="node-copy"><strong>新聞動態</strong><small>/news</small></span><span class="node-meta"><span class="count">6</span></span></button></li>
                        <li class="collapsed" data-issue="true">
                          <button class="tree-row" type="button" data-view="team" data-label="團隊 Team 組織架構 成員">

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const tree = document.getElementById('commandTree');
    const detailBody = document.getElementById('detailBody');
    const detailTitle = document.getElementById('detailTitle');
    const detailPath = document.getElementById('detailPath');
    const detailActions = document.getElementById('detailActions');
    const search = document.getElementById('globalSearch');
    const showAll = document.getElementById('showAll');
    const showIssues = document.getElementById('showIssues');
    const toast = document.getElementById('toast');
    let toastTimer;

    const viewMap = {
      overview: 'view-overview',
      website: 'view-website',
      home: 'view-website',
      page: 'view-website',
      team: 'view-team',
      organization: 'view-team',
      content: 'view-content',
      events: 'view-content',
      banners: 'view-content'
    };

    function notify(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function renderView(view) {
      const template = document.getElementById(viewMap[view] || 'view-placeholder');
      detailBody.replaceChildren(template.content.cloneNode(true));
      detailTitle.textContent = template.dataset.title;
      detailPath.textContent = template.dataset.path;

      const primaryLabels = {
        website: ['預覽網站', '管理頁面'],
        home: ['預覽首頁', '編輯首頁'],
        page: ['預覽頁面', '編輯頁面'],
        team: ['預覽團隊頁', '新增成員'],
        organization: ['預覽團隊頁', '管理組織'],
        content: ['預覽新聞頁', '新增新聞'],
        events: ['預覽活動頁', '新增活動'],
        banners: ['預覽首頁', '新增 Banner'],
        overview: ['查看前台', '新增內容']
      };
      const labels = primaryLabels[view] || ['打開模組', '管理內容'];
      detailActions.innerHTML = `<button class="button" type="button" data-toast="已打開預覽">${labels[0]}</button><button class="button primary" type="button" data-toast="已進入管理頁面">${labels[1]}</button>`;
    }

    function selectView(view, preferredLabel, clickedTarget) {
      const target = clickedTarget || [...tree.querySelectorAll('.tree-row')].find((row) => row.dataset.view === view && (!preferredLabel || row.dataset.label.includes(preferredLabel))) || tree.querySelector(`[data-view="${view}"]`);
      if (target) {
        tree.querySelectorAll('.tree-row.selected').forEach((row) => row.classList.remove('selected'));
        target.classList.add('selected');
        let parent = target.closest('li')?.parentElement?.closest('li');
        while (parent) {
          parent.classList.remove('collapsed');
          parent = parent.parentElement?.closest('li');
        }
        target.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
      renderView(view);
    }

    tree.addEventListener('click', (event) => {
      const row = event.target.closest('.tree-row');
      if (!row) return;
      const item = row.closest('li');
      if (item && item.querySelector(':scope > ul')) item.classList.toggle('collapsed');
      selectView(row.dataset.view, '', row);
    });

    document.addEventListener('click', (event) => {
      const action = event.target.closest('[data-toast]');
      if (action) notify(action.dataset.toast);
      const select = event.target.closest('[data-select]');
      if (select) selectView(select.dataset.select);
    });

    showAll.addEventListener('click', () => {
      tree.classList.remove('only-issues');
      showAll.classList.add('active');
      showIssues.classList.remove('active');
    });

    showIssues.addEventListener('click', () => {
      tree.classList.add('only-issues');
      showIssues.classList.add('active');
      showAll.classList.remove('active');
    });

    search.addEventListener('input', () => {
      const query = search.value.trim().toLocaleLowerCase();
      tree.querySelectorAll('.tree-row').forEach((row) => {
        const match = !query || row.dataset.label.toLocaleLowerCase().includes(query);
        row.classList.toggle('filtered-out', !match);
        if (match && query) {
          let parent = row.closest('li');
          while (parent) {
            parent.classList.remove('collapsed');
            parent = parent.parentElement?.closest('li');
          }
        }
      });
    });

    renderView('overview');
  </script>
